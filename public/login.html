<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dental Brasilis</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 100%; max-width: 320px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .erro { color: red; font-size: 14px; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Acesso Restrito</h2>
    <div id="mensagemErro" class="erro">Usuário ou senha inválidos.</div>
    <form id="formLogin">
        <input type="text" id="usuario" placeholder="Usuário (ex: admin)" required>
        <input type="password" id="senha" placeholder="Senha" required>
        <button type="submit">Entrar no Sistema</button>
    </form>
</div>

<script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();
        const usuario = document.getElementById('usuario').value;
        const senha = document.getElementById('senha').value;

        const resposta = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario, senha })
        });

        const dados = await resposta.json();

        if (dados.sucesso) {
            localStorage.setItem('tokenDental', dados.token);
            window.location.href = '/index.html';
        } else {
            document.getElementById('mensagemErro').style.display = 'block';
        }
    });
</script>
</body>
</html>
